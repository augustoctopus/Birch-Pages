<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1917">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>THE LEDGER — Cult of Sauna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1A1917;
    --cream: #F4EEE4;
    --amber: #C4A35A;
    --muted: rgba(244, 238, 228, 0.45);
    --faint: rgba(244, 238, 228, 0.14);
    --green: #9DBB8F;
    --red: #C97B66;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--ink);
    color: var(--cream);
    font-family: var(--sans);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 40px);
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .wordmark { font-size: 11px; font-weight: 500; letter-spacing: 4px; color: var(--muted); text-align: center; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: 1px; text-align: center; margin-top: 12px; }
  .rule { width: 36px; border-top: 1px solid var(--amber); margin: 20px auto 0; }
  .stamp { text-align: center; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  #warnings { text-align: center; font-size: 12px; line-height: 1.6; color: var(--red); margin-top: 10px; }

  /* ---------- gate ---------- */
  #gate { display: none; margin-top: 12vh; text-align: center; }
  #gate.active { display: block; }
  #gate input {
    margin-top: 36px; width: 100%; max-width: 300px;
    background: transparent; border: 1px solid var(--faint); border-radius: 999px;
    color: var(--cream); font-family: var(--sans); font-size: 16px; text-align: center;
    padding: 14px 20px; outline: none; letter-spacing: 2px;
  }
  #gate input:focus { border-color: var(--amber); }
  #gate button {
    display: block; margin: 18px auto 0; padding: 13px 44px;
    background: var(--amber); color: var(--ink); border: none; border-radius: 999px;
    font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer;
  }
  #gate-error { margin-top: 16px; font-size: 13px; color: var(--red); min-height: 18px; }

  /* ---------- ledger ---------- */
  #ledger { display: none; }
  #ledger.active { display: block; }

  #notes { margin-top: 30px; border: 1px solid var(--faint); border-radius: 12px; padding: 16px 18px; display: none; }
  #notes .n-title { font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--amber); }
  #notes ul { margin: 10px 0 0 16px; }
  #notes li { font-size: 13.5px; line-height: 1.55; color: var(--cream); margin-top: 7px; }

  section { margin-top: 38px; }
  .sec-title {
    font-size: 11px; font-weight: 500; letter-spacing: 4px; text-transform: uppercase;
    color: var(--amber); display: flex; align-items: baseline; justify-content: space-between;
  }
  .sec-title .sub { color: var(--muted); letter-spacing: 1px; text-transform: none; font-size: 11px; }

  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th {
    font-size: 10px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); text-align: right; padding: 12px 0 6px; width: 22%;
  }
  th:first-child { text-align: left; width: 34%; }
  td {
    font-size: 16.5px; font-weight: 600;
    text-align: right; padding: 9px 0 8px; border-top: 1px solid var(--faint);
    font-variant-numeric: tabular-nums; vertical-align: top;
  }
  td.label {
    font-size: 12px; letter-spacing: 1px;
    color: var(--muted); text-align: left; font-weight: 400;
  }
  td.pos { color: var(--green); }
  td.neg { color: var(--red); }
  .delta { display: block; font-size: 10.5px; font-weight: 400; margin-top: 2px; color: var(--muted); }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--red); }

  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .tab {
    background: transparent; border: 1px solid var(--faint); border-radius: 999px;
    color: var(--muted); font-family: var(--sans); font-size: 11px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase; padding: 8px 22px; cursor: pointer;
  }
  .tab.active { background: var(--amber); border-color: var(--amber); color: var(--ink); }

  #stock-table td { font-size: 14px; }
  #stock-table .inc { font-size: 11.5px; font-weight: 400; }
  .pending { font-size: 12px; color: var(--muted); margin-top: 14px; border-top: 1px solid var(--faint); padding-top: 14px; }

  #spark { display: block; width: 100%; height: 56px; margin-top: 18px; }

  .footnote { font-size: 11px; line-height: 1.6; color: var(--muted); margin-top: 44px; border-top: 1px solid var(--faint); padding-top: 16px; }
  .lock { display: block; text-align: center; margin-top: 28px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; font-family: var(--sans); width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">CULT OF SAUNA</div>
  <h1>The Ledger</h1>
  <div class="rule"></div>

  <div id="gate">
    <input id="pw" type="password" placeholder="password" autocomplete="current-password" autofocus>
    <button id="unlock">Enter</button>
    <div id="gate-error"></div>
  </div>

  <div id="ledger">
    <div class="stamp" id="stamp"></div>
    <div id="warnings"></div>

    <div id="notes">
      <div class="n-title" id="notes-title">Morning notes</div>
      <ul id="notes-list"></ul>
    </div>

    <section>
      <div class="sec-title">Shop</div>
      <table>
        <thead><tr><th></th><th class="yday-h">Yesterday</th><th>7 days</th><th id="mtd-head">MTD</th></tr></thead>
        <tbody id="shop-rows"></tbody>
      </table>
      <svg id="spark" viewBox="0 0 560 56" preserveAspectRatio="none" aria-hidden="true"></svg>
    </section>

    <section>
      <div class="sec-title">Stock <span class="sub" id="stock-sub"></span></div>
      <div class="tabs" id="stock-tabs">
        <button class="tab active" data-market="US">US</button>
        <button class="tab" data-market="UK">UK</button>
      </div>
      <table id="stock-table">
        <thead><tr><th>SKU</th><th>Stock</th><th>Out by</th><th>Incoming</th></tr></thead>
        <tbody id="stock-rows"></tbody>
      </table>
    </section>

    <section>
      <div class="sec-title">Meta</div>
      <table>
        <thead><tr><th></th><th class="yday-h">Yesterday</th><th>7 days</th><th>MTD</th></tr></thead>
        <tbody id="meta-rows"></tbody>
      </table>
    </section>

    <section>
      <div class="sec-title">Google</div>
      <div id="google-body"></div>
    </section>

    <section id="email-section" style="display:none">
      <div class="sec-title">Email <span class="sub" id="email-sub"></span></div>
      <table>
        <thead><tr><th></th><th class="yday-h">Yesterday</th><th>7 days</th><th>MTD</th></tr></thead>
        <tbody id="email-rows"></tbody>
      </table>
    </section>

    <section>
      <div class="sec-title">All-in marketing</div>
      <table>
        <thead><tr><th></th><th class="yday-h">Yesterday</th><th>7 days</th><th>MTD</th></tr></thead>
        <tbody id="blended-rows"></tbody>
      </table>
    </section>

    <div class="footnote" id="footnote"></div>
    <button class="lock" id="lock">Lock</button>
  </div>
</div>

<script>
(function () {
  var STORE_KEY = "cos-ledger-pw";
  var gate = document.getElementById("gate");
  var ledger = document.getElementById("ledger");
  var errEl = document.getElementById("gate-error");
  var encData = null;

  function b64(s) {
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decrypt(password) {
    var baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(encData.salt), iterations: 310000, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(encData.iv) }, key, b64(encData.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  var SYM = "£";
  function money(n, dp) {
    if (n === null || n === undefined) return "—";
    var neg = n < 0; n = Math.abs(n);
    var s = n.toLocaleString("en-GB", { minimumFractionDigits: dp, maximumFractionDigits: dp });
    return (neg ? "−" : "") + SYM + s;
  }
  function num(n) { return n === null || n === undefined ? "—" : n.toLocaleString("en-GB"); }
  function fmtDate(iso) {
    if (!iso) return "—";
    var p = iso.split("-");
    return Number(p[2]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(p[1]) - 1];
  }

  // delta: pct change current vs prev. goodUp: is an increase good?
  function deltaHtml(cur, prev, goodUp) {
    if (cur === null || cur === undefined || prev === null || prev === undefined || prev === 0)
      return '<span class="delta">&nbsp;</span>';
    var pct = (cur - prev) / Math.abs(prev) * 100;
    if (!isFinite(pct)) return '<span class="delta">&nbsp;</span>';
    var up = pct >= 0;
    var good = goodUp === null ? null : (up === goodUp);
    var cls = good === null ? "" : good ? " up" : " down";
    var arrow = up ? "▲" : "▼";
    return '<span class="delta' + cls + '">' + arrow + " " + Math.abs(pct).toFixed(0) + "%</span>";
  }

  // one row across the three periods; field: name in period objects
  function row(d, label, field, opts) {
    opts = opts || {};
    var cells = ["yday", "d7", "mtd"].map(function (k) {
      var p = d.periods[k];
      var v = p[field];
      var prev = p.prev ? p.prev[field] : null;
      var text = opts.fmt ? opts.fmt(v) : num(v);
      var cls = "";
      if (opts.signed && typeof v === "number") cls = v >= 0 ? ' class="pos"' : ' class="neg"';
      return "<td" + cls + ">" + text + deltaHtml(v, prev, "goodUp" in opts ? opts.goodUp : true) + "</td>";
    }).join("");
    return '<tr><td class="label">' + label + "</td>" + cells + "</tr>";
  }

  function render(d) {
    SYM = d.currency === "GBP" ? "£" : d.currency + " ";
    var upd = new Date(d.updated_at);
    document.getElementById("stamp").textContent =
      "Through " + fmtDate(d.window_meta.yday.end) + " · updated " +
      upd.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " +
      upd.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

    if (d.warnings && d.warnings.length) {
      document.getElementById("warnings").innerHTML =
        d.warnings.map(function (w) { return "⚠ " + w; }).join("<br>");
    }

    if (d.summary && d.summary.bullets && d.summary.bullets.length) {
      var n = document.getElementById("notes");
      n.style.display = "block";
      document.getElementById("notes-title").textContent = "Morning notes · " + fmtDate(d.summary.date);
      document.getElementById("notes-list").innerHTML =
        d.summary.bullets.map(function (b) { return "<li>" + b + "</li>"; }).join("");
    }

    var m0 = (v) => money(v, 0), m2 = (v) => money(v, 2);
    document.getElementById("shop-rows").innerHTML =
      row(d, "Sales", "total_sales", { fmt: m0 }) +
      row(d, "Net profit", "net_profit", { fmt: m0, signed: true }) +
      row(d, "Orders", "orders", {}) +
      row(d, "AOV", "aov", { fmt: m2 }) +
      '<tr><td class="label">Units (hat · towel)</td>' + ["yday", "d7", "mtd"].map(function (k) {
        var p = d.periods[k];
        return "<td>" + num(p.hat_units) + " · " + num(p.towel_units) + "</td>";
      }).join("") + "</tr>";

    document.getElementById("meta-rows").innerHTML =
      row(d, "Spend", "meta_spend", { fmt: m0, goodUp: null }) +
      row(d, "CPA", "meta_cpa", { fmt: m2, goodUp: false }) +
      row(d, "Purchases", "meta_purchases", {});

    document.getElementById("google-body").innerHTML = d.google_connected
      ? '<table><thead><tr><th></th><th class="yday-h">Yesterday</th><th>7 days</th><th>MTD</th></tr></thead><tbody>' +
        row(d, "Spend", "google_spend", { fmt: m0, goodUp: null }) +
        row(d, "CPA", "google_cpa", { fmt: m2, goodUp: false }) +
        "</tbody></table>"
      : '<div class="pending">Not connected.</div>';

    if (d.email) {
      document.getElementById("email-section").style.display = "";
      document.getElementById("email-sub").textContent = num(d.email.total) + " subscribers";
      var e = d.email;
      document.getElementById("email-rows").innerHTML =
        '<tr><td class="label">Net new subs</td>' + ["yday", "d7", "mtd"].map(function (k) {
          var v = e.windows[k], prev = e.compare ? e.compare[k] : null;
          return "<td>" + num(v) + deltaHtml(v, prev, true) + "</td>";
        }).join("") + "</tr>";
    }

    document.getElementById("blended-rows").innerHTML =
      row(d, "Spend", "all_spend", { fmt: m0, goodUp: null }) +
      row(d, "Blended CPA", "blended_cpa", { fmt: m2, goodUp: false }) +
      row(d, "MER", "mer", { fmt: function (v) { return v === null ? "—" : v.toFixed(2) + "×"; } });

    // stock
    document.getElementById("stock-sub").textContent = "counted " + fmtDate(d.stock.fetched_at);
    var renderStock = function (market) {
      document.getElementById("stock-rows").innerHTML = d.stock.skus
        .filter(function (s) { return s.market === market; })
        .map(function (s) {
          var days = s.days_left;
          var outCls = days === null ? "" : days < 14 ? ' class="neg"' : days < 30 ? "" : ' class="pos"';
          var outTxt = days === null ? "—" : days === 0 ? "now" : fmtDate(s.out_date);
          var name = (s.product.indexOf("Towel") >= 0 ? "Towel — " : "Hat — ") + s.variant;
          var inc = "—";
          if (s.incoming) {
            var eta = s.incoming.eta ? fmtDate(s.incoming.eta) : "in prod";
            var covCls = s.incoming.eta ? (s.incoming.covered ? "pos" : "neg") : "";
            inc = '<span class="inc ' + covCls + '">' + num(s.incoming.qty) + " · " + eta + "</span>";
          }
          return '<tr><td class="label">' + name + "</td><td>" + num(s.stock) + "</td><td" + outCls + ">" +
            outTxt + "</td><td>" + inc + "</td></tr>";
        }).join("");
    };
    var tabs = document.querySelectorAll("#stock-tabs .tab");
    tabs.forEach(function (t) {
      t.addEventListener("click", function () {
        tabs.forEach(function (o) { o.classList.remove("active"); });
        t.classList.add("active");
        renderStock(t.dataset.market);
      });
    });
    renderStock("US");

    var a = d.assumptions;
    document.getElementById("footnote").textContent =
      "Net profit = net sales − unit costs (hat £" + a.unit_costs_gbp.hat + ", towel £" + a.unit_costs_gbp.towel +
      ") − $" + a.delivery_per_order_usd + " delivery per order − $" +
      (a.fixed_daily_usd.staff + a.fixed_daily_usd.software) + "/day staff & software − all ad spend (USD at " +
      a.fx_usd_gbp + "). D2C only — B2B and payment fees excluded. Deltas: yesterday vs day before; 7 days vs prior 7; " +
      "MTD vs same days last month. Blended CPA = total ad spend ÷ all orders. Incoming = next PO (LH ETD ex-factory).";

    document.querySelectorAll(".yday-h").forEach(function (h) { h.textContent = d.window_meta.yday.label; });
    drawSpark(d.series);
    gate.classList.remove("active");
    ledger.classList.add("active");
  }

  function drawSpark(series) {
    if (!series || series.length < 2) return;
    var svg = document.getElementById("spark");
    var W = 560, H = 56, PAD = 2;
    var max = Math.max.apply(null, series.map(function (p) { return p.sales; }));
    var pts = series.map(function (p, i) {
      var x = PAD + (i / (series.length - 1)) * (W - 2 * PAD);
      var y = H - PAD - (p.sales / max) * (H - 2 * PAD);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    svg.innerHTML = '<polyline fill="none" stroke="#C4A35A" stroke-width="1.5" points="' + pts.join(" ") + '"/>';
  }

  async function tryUnlock(password, silent) {
    try {
      var data = await decrypt(password);
      localStorage.setItem(STORE_KEY, password);
      render(data);
    } catch (e) {
      localStorage.removeItem(STORE_KEY);
      if (!silent) errEl.textContent = "That's not it.";
      gate.classList.add("active");
    }
  }

  document.getElementById("unlock").addEventListener("click", function () {
    tryUnlock(document.getElementById("pw").value, false);
  });
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock(e.target.value, false);
  });
  document.getElementById("lock").addEventListener("click", function () {
    localStorage.removeItem(STORE_KEY);
    location.reload();
  });

  fetch("data.enc.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      encData = j;
      var saved = localStorage.getItem(STORE_KEY);
      if (saved) tryUnlock(saved, true);
      else gate.classList.add("active");
    })
    .catch(function () {
      gate.classList.add("active");
      errEl.textContent = "No data file found.";
    });
})();
</script>
</body>
</html>
